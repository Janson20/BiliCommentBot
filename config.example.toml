# B站评论自动回复机器人配置文件

# B站API配置
[bilibili]
# B站Cookie（从浏览器获取）
cookie = ""
# 刷新令牌（用于自动刷新Cookie）
refresh_token = ""
# 你的B站用户ID
uid = ""
# 检查评论的间隔时间（秒）
check_interval = 60
# 是否启用Cookie自动刷新
auto_refresh_cookie = true
# Cookie刷新检查间隔（分钟）
cookie_refresh_interval = 30
# 获取评论的最大页数
max_comment_pages = 10
# 获取视频的最大页数
max_video_pages = 10

# 请求频率控制配置
[rate_limit]
# 最小请求间隔（秒）
min_request_interval = 2.0
# 最大重试次数
max_retries = 3
# 重试基础延迟（秒）
retry_delay = 5

# 缓存配置
[cache]
# 缓存过期时间（秒）
expire_time = 300
# 是否启用缓存
enabled = true

# 视频列表缓存配置
[video_cache]
# 视频列表缓存时间（秒），默认12小时（43200秒）
expire_time = 43200
# 缓存文件路径
cache_file = "video_cache.json"

# DeepSeek API配置
[deepseek]
# DeepSeek API密钥
api_key = "sk-xxx"
# API基础URL
base_url = "https://api.deepseek.com/v1"
# 使用的模型
model = "deepseek-chat"
# 最大回复长度
max_tokens = 200
# 温度参数（0-1，控制回复的随机性）
temperature = 0.7
# 系统提示词（定义AI的角色和行为）
system_prompt = "你是一个友善的B站游戏区Minecraft UP主，请对评论做出自然、友好的回复。回复要简洁明了，控制在100字以内。"

# 回复配置
[reply]
# 是否启用自动回复
enabled = true
# 回复前缀
prefix = "🤖 "
# 是否只回复未处理的评论
only_new = true
# 每次最多处理的评论数
max_process = 10
# 回复延迟（秒，避免频繁操作）
reply_delay = 2
# 生成回复时使用前N条评论作为上下文（0表示不使用上下文）
context_comments_count = 10
# 仅回复指定视频（留空则回复所有视频，填写BVID如BV1xx411c7mD则仅回复该视频）
only_bvid = ""
# 回复后是否点赞评论用户的最新视频
like_user_video_enabled = false
# 是否仅点赞关注了你的用户的视频（需要配置 uid）
like_user_video_only_followers = false
# 是否启用链式回复（楼中楼）
chained_reply_enabled = true
# 最大回复深度（层数），设置楼中楼回复的最大嵌套层数
max_reply_depth = 3

# 日志配置
[logging]
# 日志级别（DEBUG, INFO, WARNING, ERROR）
level = "INFO"
# 日志文件路径
file = "logs/bot.log"
# 是否输出到控制台
console = true

# 安全配置
[auth]
# 是否启用登录密码保护
enabled = false
# 登录密码（SHA-256哈希值，通过Web UI设置）
password = ""