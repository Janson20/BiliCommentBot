version: '3.8'

services:
  bilicomment:
    build: .
    image: janson20/bilicommentbot:latest
    container_name: bilicomment-bot
    ports:
      - "5000:5000"
    volumes:
      # 所有配置和数据文件统一存储在 ./data 目录，只需挂载一个卷
      - ./data:/app/data
    environment:
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
      - BILI_DATA_DIR=/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
